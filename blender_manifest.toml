schema_version = "1.1.0"
id = "freepencil2_svg_mod"
version = "2.11.1"
name = "FreePencil2 - SVG Mod"
description = "Generates line art from 3D models and writes it as plotter-ready SVG vectors. Fork of FreePencil2 by Masamune Sakaki, with the vector pipeline as the primary output; the original raster pipeline is kept unchanged."
tagline = "Plotter-ready SVG line art from 3D models"
maintainer = "scrivi@triplette.it"
type = "add-on"
blender_version_min = "4.2.0"
license = ["GPL-3.0-or-later"]
[permissions]
files = "Write line/color/shadow passes and camera batch renders"

# 配布ZIPに含めないもの。指定しないと dev/(評価パイプラインの成果物や
# テスト用モデル)や old_ver/ まで巻き込んで 1GB 超になる(実測)
[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".git/",
  ".gitignore",
  "note/",
  "*.png",
  "*.jpg",
  "*.mp4",
  "dev/",
  "dist/",
  "old_ver/",
  "merge/",
  "Gemini/",
  "*.blend",
  "*.blend1",
  "*.zip",
  "*.log",
  "settings.json",
  # ローカル環境の設定。ユーザー名や無関係なプロジェクトのパスが入るため
  # 配布物に含めてはいけない(実際に混入していた)
  "claude_desktop_config.json",
  "mcp-info.json",
  "config.json",
  "debug_install.bat",
  ".github/",
  ".flake8",
  ".ruff.toml",
  ".gitattributes",
  "scripts/",
]