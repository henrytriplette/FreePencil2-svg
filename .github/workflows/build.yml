name: Build check

# 配布物はここから出さない。GitHub は開発リポジトリで、すぐ使える zip は
# note で配る方針(README 参照)。ここでやるのは「壊れていないこと」の確認だけ。
#
# 第三者の action は使わない。以前 nutti/blender-action@v1 を参照していたが
# その action は存在せず、「Set up job」の段階で毎回落ちていた(v2.7.0 の
# タグ push で発覚)。Blender は公式配布から直接取る。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # 手動実行。タグを打ち直さずに検査だけ回したいときに使う
  workflow_dispatch:

env:
  BLENDER_VERSION: "4.5.2"
  BLENDER_SERIES: "Blender4.5"

jobs:
  meta:
    # Blender を要さない検査。落ちるならここで早く落ちてほしい
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: マニフェストと bl_info の版が一致することを確認する
        run: |
          set -eu
          man=$(sed -n 's/^version *= *"\(.*\)"/\1/p' blender_manifest.toml)
          info=$(sed -n 's/.*"version": *(\([0-9]*\), *\([0-9]*\), *\([0-9]*\)).*/\1.\2.\3/p' __init__.py | head -1)
          echo "manifest=$man  bl_info=$info"
          test "$man" = "$info"

      - name: タグを打ったなら版が一致することを確認する
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          man=$(sed -n 's/^version *= *"\(.*\)"/\1/p' blender_manifest.toml)
          echo "tag=$tag  manifest=$man"
          test "$tag" = "$man"

      # 「開発ビルドの通し番号(DEV_BUILD)が残っていないこと」を見る検査が
      # ここにあったが、外した。DEV_BUILD を書く仕組みがこのリポジトリに
      # 無く(参照していた scripts/stamp_dev.py も、案内していた
      # install_all.py --release も存在しない)、絶対に成立しない検査が
      # 存在しないスクリプトを案内していたため。
      # 開発ビルドに印を付ける仕組みを入れるなら、その時に検査も戻すこと。

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Blender を取得する
        run: |
          set -eu
          url="https://download.blender.org/release/${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "$url"
          curl -fsSL "$url" -o blender.tar.xz
          mkdir -p "$HOME/blender"
          tar -xJf blender.tar.xz -C "$HOME/blender" --strip-components=1
          "$HOME/blender/blender" --version

      - name: 配布 zip が作れて検証を通ることを確認する
        run: |
          set -eu
          mkdir -p dist
          "$HOME/blender/blender" --command extension build \
            --source-dir . --output-dir dist
          zip=$(ls dist/*.zip)
          echo "built: $zip ($(stat -c%s "$zip") bytes)"
          "$HOME/blender/blender" --command extension validate "$zip"
